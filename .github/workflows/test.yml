name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: uv venv --python 3.11 && uv pip install -e '.[dev,mcp]'
      - run: .venv/bin/pytest -q
      - name: Quality gate (synthetic, offline)
        run: .venv/bin/python -m bench.qa_bench synthetic
