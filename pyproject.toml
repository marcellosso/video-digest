[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "video-digest"
version = "0.1.0.dev0"
description = "Turn a video into a compact digest (keyframes, contact sheets, timeline) that AI models can read cheaply"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "pillow>=10.1",
]

[project.scripts]
video-digest = "video_digest.cli:main"
video-digest-mcp = "video_digest.mcp_server:main"

[project.optional-dependencies]
dev = ["pytest>=8"]
bench = ["anthropic>=2.3"]
mcp = ["mcp>=2,<3"]

[tool.hatch.build.targets.wheel]
packages = ["src/video_digest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "."]
